name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux,   goarch: amd64, ext: ""}
          - {goos: darwin,  goarch: arm64, ext: ""}
          - {goos: darwin,  goarch: amd64, ext: ""}
          - {goos: windows, goarch: amd64, ext: ".exe"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
        if: matrix.goos == 'linux'
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          flags="-s -w"
          [ "$GOOS" = windows ] && flags="$flags -H windowsgui"
          name="repi-${GOOS}-${GOARCH}"
          mkdir "$name"
          go build -trimpath -ldflags "$flags" -o "$name/repi${{ matrix.ext }}" .
          cp README.md "$name/"
          if [ "$GOOS" = windows ]; then zip -r "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: repi-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            repi-*.zip
            repi-*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
